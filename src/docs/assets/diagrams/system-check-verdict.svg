<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" role="img">
  <title>系统检查 · 批次判定与终态</title>
  <desc>一个批次的判定结果分三支：通过立即办结、软性按门禁处理、未通过进下一批；到批次上限时必过终止全部流程、软性按未取得结论放行；取数异常单独重试不占上限。</desc>
  <defs>
    <marker id="rf-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="rf-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="60" y="26" width="880" height="62" rx="12" fill="#F1EFE8" stroke="#888780"/>
  <text x="84" y="54" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#2C2C2A">一个批次的判定</text>
  <text x="84" y="76" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#5F5E5A">某检查项 × 某个员工：当批取到的指标原值，比对「当批生效条件」（条件随批次留痕，不互相覆盖）</text>

  <path d="M200 88 V118" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#rf-arrow)"/>
  <path d="M500 88 V118" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#rf-arrow)"/>
  <path d="M800 88 V118" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#rf-arrow)"/>

  <rect x="60" y="124" width="280" height="54" rx="10" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="200" y="147" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="600" fill="#085041">命中 · 通过</text>
  <text x="200" y="166" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0F6E56">= 期望结果</text>

  <rect x="360" y="124" width="280" height="54" rx="10" fill="#FAEEDA" stroke="#BA7517"/>
  <text x="500" y="147" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="600" fill="#633806">命中 · 软性</text>
  <text x="500" y="166" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#854F0B">= 差异区间（多条件 且 / 或）</text>

  <rect x="660" y="124" width="280" height="54" rx="10" fill="#FCEBEB" stroke="#A32D2D"/>
  <text x="800" y="147" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="600" fill="#A32D2D">都不命中 · 未通过</text>
  <text x="800" y="166" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#A32D2D">既不是通过、也不是软性</text>

  <path d="M200 178 V204" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#rf-arrow)"/>
  <path d="M500 178 V204" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#rf-arrow)"/>
  <path d="M800 178 V204" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#rf-arrow)"/>

  <rect x="60" y="208" width="280" height="128" rx="10" fill="#FFFFFF" stroke="#0F6E56"/>
  <text x="84" y="234" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="600" fill="#085041">立即办结 · 节点完成</text>
  <text x="84" y="258" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.8" fill="#0F6E56">当场办结，不再取数</text>
  <text x="84" y="278" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.8" fill="#0F6E56">不消耗批次上限，止住后续</text>
  <text x="84" y="298" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.8" fill="#0F6E56">下游节点随即可办</text>

  <rect x="360" y="208" width="280" height="128" rx="10" fill="#FFFFFF" stroke="#BA7517"/>
  <text x="384" y="234" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="600" fill="#633806">按门禁分别处理</text>
  <text x="384" y="258" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.8" fill="#854F0B">必过门禁：不放行，继续取下一批</text>
  <text x="384" y="278" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.8" fill="#854F0B">软性门禁：可放行，结果留痕</text>
  <text x="384" y="298" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.8" fill="#854F0B">两种情况都不算「未通过批次」</text>

  <rect x="660" y="208" width="280" height="128" rx="10" fill="#FFFFFF" stroke="#A32D2D"/>
  <text x="684" y="234" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="600" fill="#A32D2D">计 1 个未通过批次</text>
  <text x="684" y="258" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.8" fill="#A32D2D">未到上限：等下一批继续盘查</text>
  <text x="684" y="278" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.8" fill="#A32D2D">到上限：进下方终态规则</text>
  <text x="684" y="298" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.8" fill="#A32D2D">同一批次反复取到，不重复计</text>

  <path d="M800 336 V360" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#rf-arrow-red)"/>

  <rect x="60" y="366" width="430" height="86" rx="10" fill="#FCEBEB" stroke="#A32D2D"/>
  <text x="84" y="392" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="600" fill="#A32D2D">必过 · 到上限仍未通过 → 终止全部流程</text>
  <text x="84" y="414" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.8" fill="#A32D2D">实时执行，不等其他并行节点；在途节点转「因终止关闭」</text>
  <text x="84" y="434" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.8" fill="#A32D2D">单据作废、需重新发起；不允许跳过</text>

  <rect x="510" y="366" width="430" height="86" rx="10" fill="#FAEEDA" stroke="#BA7517"/>
  <text x="534" y="392" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="600" fill="#633806">软性 · 到上限仍未通过 → 放行留痕</text>
  <text x="534" y="414" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.8" fill="#854F0B">按「未取得结论」落结果，不阻塞下游</text>
  <text x="534" y="434" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.8" fill="#854F0B">检查记录留痕可查，建议软性项也设上限</text>

  <text x="60" y="482" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#5F5E5A">取数异常（拉不到数据）≠ 未通过：单独标记并重试，不占批次上限、不影响门禁判断。</text>
</svg>
